[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "nexus-verity"
version = "1.0.0"
description = "Pearl Causal DAG & PC Discovery Engine, Chernozhukov Cross-Fitted Double/Debiased ML (DML), Finite-Sample Split Conformal Prediction, Native C++20 Doubly-Robust Counterfactual Policy Evaluator, and Live Qwen-3.5-4B Simpson's-Paradox Gate"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Nagarjuna Kamireddy", email = "sendemailtonagarjuna@gmail.com" },
]
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "numpy>=2.1.0",
    "pydantic>=2.10.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.122.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[project.scripts]
nexus = "nexus_verity.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_verity"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
